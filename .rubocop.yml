AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false

plugins:
  - rubocop-rake
  - rubocop-rspec

# Metrics

Metrics/ClassLength:
  Max: 150

# Style

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true

Layout/LineLength:
  Max: 120

# RSpec

RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Max: 5

RSpec/AnyInstance:
  Enabled: false

RSpec/MessageSpies:
  Enabled: false

# Naming

Naming/PredicatePrefix:
  Enabled: true
  ForbiddenPrefixes:
    - is_
  AllowedMethods:
    - has_next_page?
    - has_previous_page?
